name: Keep Streamlit Awake

on:
  schedule:
    # Runs every 15 minutes (UTC time)
    - cron: "*/15 * * * *"
  workflow_dispatch:   # allows manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Timestamp check
        run: echo "Cron triggered at $(date -u)"

      - name: Curl Streamlit App
        run: curl -s https://hindidivas-2026.streamlit.app > /dev/null
